services:
  chatbackup:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    # Restarts after crashes and reboots, but stays down after "docker compose stop".
    restart: unless-stopped
    # Reaps leftover Chromium processes.
    init: true
    # Playwright's recommendation for Chromium: without it, Chromium can run out of shared memory.
    ipc: host
    # Turns a slow Chromium memory leak into a quick restart instead of a frozen machine.
    mem_limit: 2g
    stop_grace_period: 30s
    # Docker only reports this status; recovery is the app's own watchdog plus the restart policy.
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.heartbeat && test $$(( $$(date +%s) - $$(cat /data/.heartbeat) )) -lt 300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
