<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Tip Calculator</h1>

      <label for="bill">Bill amount ($)</label>
      <input type="number" id="bill" placeholder="0.00" min="0" step="0.01" />

      <label for="tip">Tip percentage (%)</label>
      <input type="number" id="tip" placeholder="18" min="0" step="1" />

      <label for="people">Number of people</label>
      <input type="number" id="people" placeholder="1" min="1" step="1" />

      <div class="results">
        <div class="result-row">
          <span>Tip amount</span>
          <span id="tip-amount">$0.00</span>
        </div>
        <div class="result-row">
          <span>Total bill</span>
          <span id="total">$0.00</span>
        </div>
        <div class="result-row highlight">
          <span>Per person</span>
          <span id="per-person">$0.00</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
